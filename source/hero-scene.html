<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Night-time site plan seen from a monitoring screen. Loops every 10 s.
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720,T=10;
const TAU=Math.PI*2;
// perspective helper: plan coords (u,v in 0..1) -> screen
function P(u,v){const z=0.55+v*0.75;const sx=W/2+(u-0.5)*W*0.95*z;const sy=120+v*520;return [sx,sy];}
const fence=[[0.08,0.08],[0.92,0.08],[0.95,0.92],[0.05,0.92]];
const buildings=[[0.18,0.2,0.22,0.18],[0.52,0.18,0.25,0.14],[0.22,0.55,0.16,0.2],[0.6,0.52,0.2,0.24]];
const cams=[[0.08,0.08,0.6],[0.92,0.08,2.3],[0.95,0.92,3.9],[0.05,0.92,5.4],[0.5,0.45,1.2]];
const patrol=[[0.12,0.12],[0.88,0.12],[0.9,0.88],[0.1,0.88]];
const checkpoints=patrol;
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
const stars=[...Array(90)].map(()=>[rnd()*W,rnd()*110,rnd()]);
const noise=[...Array(1400)].map(()=>[rnd()*W,rnd()*H,rnd()]);
function poly(pts,fill,stroke,lw){x.beginPath();pts.forEach((p,i)=>{const [a,b]=P(p[0],p[1]);i?x.lineTo(a,b):x.moveTo(a,b)});x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||1;x.stroke()}}
function lerp(a,b,k){return a+(b-a)*k}
function draw(t){
  const ph=(t%T)/T;
  // sky + ground
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#040817');g.addColorStop(0.2,'#071030');g.addColorStop(1,'#030614');x.fillStyle=g;x.fillRect(0,0,W,H);
  stars.forEach(s=>{x.fillStyle=`rgba(180,220,255,${0.25+0.35*Math.abs(Math.sin(TAU*ph*2+s[2]*9))})`;x.fillRect(s[0],s[1],1.5,1.5)});
  // grid
  x.strokeStyle='rgba(19,200,232,0.07)';x.lineWidth=1;
  for(let i=0;i<=20;i++){const u=i/20;x.beginPath();let a=P(u,-0.05),b=P(u,1.05);x.moveTo(...a);x.lineTo(...b);x.stroke();}
  for(let i=0;i<=16;i++){const v=-0.05+i*1.1/16;x.beginPath();let a=P(-0.05,v),b=P(1.05,v);x.moveTo(...a);x.lineTo(...b);x.stroke();}
  // ground inside fence
  poly(fence,'rgba(10,40,90,0.35)');
  // buildings (extruded)
  buildings.forEach(([u,v,w,h],i)=>{const pts=[[u,v],[u+w,v],[u+w,v+h],[u,v+h]];
    const top=pts.map(p=>{const [a,b]=P(p[0],p[1]);return [a,b-38-(i%2)*14]});
    x.fillStyle='rgba(14,30,72,0.95)';x.beginPath();const fr=[P(u,v+h),P(u+w,v+h)];x.moveTo(...fr[0]);x.lineTo(...fr[1]);x.lineTo(top[2][0],top[2][1]);x.lineTo(top[3][0],top[3][1]);x.closePath();x.fill();
    x.fillStyle='rgba(22,48,110,0.95)';x.beginPath();top.forEach((p,k)=>k?x.lineTo(...p):x.moveTo(...p));x.closePath();x.fill();x.strokeStyle='rgba(19,200,232,0.35)';x.stroke();
    // lit windows
    for(let k=0;k<6;k++){const wx=lerp(fr[0][0],fr[1][0],(k+0.5)/6);const on=Math.sin(TAU*ph+k*1.7+i)>-0.3;x.fillStyle=on?'rgba(255,200,110,0.75)':'rgba(255,200,110,0.12)';x.fillRect(wx-4,fr[0][1]-26-(i%2)*6,8,6);}
  });
  // camera cones
  cams.forEach(([u,v,a0],i)=>{const ang=a0+0.55*Math.sin(TAU*ph+i*1.3);const [cx,cy]=P(u,v);const R=230,sp=0.42;
    const gr=x.createRadialGradient(cx,cy,4,cx,cy,R);gr.addColorStop(0,'rgba(19,200,232,0.38)');gr.addColorStop(1,'rgba(19,200,232,0)');
    x.fillStyle=gr;x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,R,ang-sp,ang+sp);x.closePath();x.fill();
    x.fillStyle='#13C8E8';x.beginPath();x.arc(cx,cy,5,0,TAU);x.fill();
  });
  // electric fence pulse
  const per=[...fence,fence[0]];
  x.lineWidth=2.4;x.strokeStyle='rgba(19,200,232,0.55)';poly(fence,null,'rgba(19,200,232,0.55)',2.4);
  for(let k=0;k<3;k++){const q=(ph*3+k/3)%1;const seg=Math.floor(q*4),f=q*4-seg;const a=per[seg],b=per[seg+1];const [px,py]=P(lerp(a[0],b[0],f),lerp(a[1],b[1],f));
    const gl=x.createRadialGradient(px,py,0,px,py,26);gl.addColorStop(0,'rgba(170,245,255,0.95)');gl.addColorStop(1,'rgba(19,200,232,0)');x.fillStyle=gl;x.beginPath();x.arc(px,py,26,0,TAU);x.fill();}
  // fence posts
  for(let s=0;s<4;s++)for(let k=0;k<12;k++){const a=per[s],b=per[s+1];const [px,py]=P(lerp(a[0],b[0],k/12),lerp(a[1],b[1],k/12));x.fillStyle='rgba(120,200,230,0.6)';x.fillRect(px-1,py-10,2,10);}
  // patrol guard
  const q=ph,seg=Math.floor(q*4),f=q*4-seg;const a=patrol[seg],b=patrol[(seg+1)%4];const [gx,gy]=P(lerp(a[0],b[0],f),lerp(a[1],b[1],f));
  checkpoints.forEach((cp,i)=>{const [px,py]=P(cp[0],cp[1]);const done=i<=seg;x.strokeStyle=done?'rgba(52,211,153,0.9)':'rgba(255,255,255,0.35)';x.lineWidth=2;x.beginPath();x.arc(px,py,9,0,TAU);x.stroke();});
  const pulse=(Math.sin(TAU*ph*8)+1)/2;x.fillStyle=`rgba(52,211,153,${0.25+0.3*pulse})`;x.beginPath();x.arc(gx,gy,14+6*pulse,0,TAU);x.fill();x.fillStyle='#34D399';x.beginPath();x.arc(gx,gy,5.5,0,TAU);x.fill();
  // scan bar
  const sy=((ph*2)%1)*H;const sg=x.createLinearGradient(0,sy-80,0,sy);sg.addColorStop(0,'rgba(19,200,232,0)');sg.addColorStop(1,'rgba(19,200,232,0.10)');x.fillStyle=sg;x.fillRect(0,sy-80,W,80);
  // scanlines + grain
  x.fillStyle='rgba(0,0,0,0.18)';for(let y=0;y<H;y+=3)x.fillRect(0,y,W,1);
  const off=Math.floor(t*30)*37;noise.forEach((n,i)=>{const k=(i*13+off)%noise.length;x.fillStyle=`rgba(255,255,255,${0.05*noise[k][2]})`;x.fillRect(n[0],n[1],1,1)});
  // vignette
  const v=x.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.7)');x.fillStyle=v;x.fillRect(0,0,W,H);
}
window.draw=draw;draw(0);
</script></body></html>
