<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Software for security and systems installers, by Ivula Technologies. Live demos.">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ivula Secure Ops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: a night-shift control room. Video hero, then panels that behave like the real screens a technician, guard or office manager would use. Single dark look by choice. */
:root{
  --bg:#050a1a; --panel:#0b1430; --panel2:#0f1b3d; --line:#1d2b55; --line2:#2a3c70;
  --fg:#e7ecff; --mute:#93a0c8; --dim:#6a779f;
  --cyan:#13c8e8; --cyan2:#0aa9df; --navy:#0b165a;
  --ok:#34d399; --warn:#f5b841; --bad:#f87171;
  --display:"Space Grotesk",Inter,system-ui,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.mute{color:var(--mute)} .mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none;color:var(--fg);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#04122b}
.btn.pri:hover{background:#4fdcf3}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:#3a1220;border-color:#7a2235;color:#ffd5db}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{background:#081029;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:var(--ok);border-color:#1d5e48;background:#0b2a22}
.warn{color:var(--warn);border-color:#6b5317;background:#2a2109}
.bad{color:var(--bad);border-color:#6d2630;background:#2c0f15}
.info{color:var(--cyan);border-color:#185a6b;background:#08243a}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:rgba(5,10,26,.92)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,10,26,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--display);font-weight:700;font-size:17px;flex:none}
.brand svg{width:26px;height:30px}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mute);font-weight:400;margin-top:-3px}
nav.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav.links::-webkit-scrollbar{display:none}
nav.links a{color:var(--mute);text-decoration:none;font-size:14px;font-weight:500;padding:7px 11px;border-radius:8px;white-space:nowrap}
nav.links a:hover{color:var(--fg)}
nav.links a.on{color:var(--fg);background:var(--panel2)}
nav.links a.star{color:var(--cyan)}

/* hero */
.hero{position:relative;overflow:hidden;min-height:620px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.hero video,.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,10,26,.94) 0%,rgba(5,10,26,.72) 45%,rgba(5,10,26,.25) 100%),linear-gradient(0deg,rgba(5,10,26,1) 0%,rgba(5,10,26,0) 40%)}
.hero .wrap{position:relative;padding-block:120px 64px;width:100%}
.hero h1{font-size:clamp(36px,6vw,66px);line-height:1.02;max-width:12.5em;margin:14px 0 18px}
.hero h1 em{font-style:normal;color:var(--cyan)}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);max-width:36em;color:#c6d0f0;margin:0 0 26px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.rec{position:absolute;top:84px;right:max(16px,env(safe-area-inset-right,0px));font-family:var(--mono);font-size:12px;color:#c9d6ff;display:flex;gap:14px;align-items:center;background:rgba(5,10,26,.55);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.rec b{color:var(--bad);display:flex;align-items:center;gap:6px}
.rec b:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.rec b:before{animation:none}}

section.block{padding-block:72px}
.sec-head{display:grid;gap:10px;margin-bottom:30px;max-width:46em}
.sec-head h2{font-size:clamp(26px,3.4vw,38px);line-height:1.1}

/* main offer */
.offer{border:1px solid var(--line2);border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,#0f2a55 0%,var(--panel) 55%);padding:34px;display:grid;grid-template-columns:1.25fr 1fr;gap:34px}
.offer h2{font-size:clamp(26px,3.2vw,36px);line-height:1.1;margin:10px 0 12px}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 26px}
.part{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(5,10,26,.4)}
.part b{display:block;font-size:15px;margin-bottom:3px}
.part span{color:var(--mute);font-size:14px}
.pilot{border:1px solid #185a6b;border-radius:16px;background:#071d33;padding:24px;display:grid;gap:14px;align-content:start}
.pilot h3{font-size:22px}
.weeks{display:grid;gap:10px;margin:4px 0 6px}
.week{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:14px}
.week .mono{color:var(--cyan);font-size:12px;padding-top:2px}

/* solution cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sol{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:22px;display:grid;gap:10px;align-content:start;text-decoration:none;color:var(--fg);transition:border-color .2s,transform .2s}
.sol:hover{border-color:var(--cyan);transform:translateY(-2px)}
.sol .ic{width:42px;height:42px;border-radius:11px;background:#08243a;display:grid;place-items:center}
.sol .ic svg{width:22px;height:22px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sol h3{font-size:20px}
.sol ul{margin:0;padding-left:18px;color:var(--mute);font-size:14px}
.sol .go{color:var(--cyan);font-weight:600;font-size:14px;margin-top:4px}

.contact{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;border:1px solid var(--line2);border-radius:18px;padding:26px;background:var(--panel)}
.contact img{width:84px;height:84px;border-radius:50%;border:2px solid var(--cyan)}
.contact .rows{display:grid;gap:2px;font-size:15px}
.contact .rows span{color:var(--mute);font-family:var(--mono);font-size:12px;display:inline-block;width:56px}
footer{border-top:1px solid var(--line);padding-block:26px;color:var(--dim);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* demo pages */
.page-head{padding-block:44px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0a1636 0%,var(--bg) 100%)}
.page-head h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:10px 0 10px}
.page-head p{max-width:46em;color:#c6d0f0;margin:0}
.demo-note{display:inline-flex;gap:8px;align-items:center;margin-top:16px;font-size:13px;color:var(--warn);font-family:var(--mono)}
.demo{padding-block:28px 64px;display:grid;gap:18px}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);min-width:0}
.panel>.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.ph h3{font-size:17px}
.panel>.pb{padding:18px}
.cols{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--mute);text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{white-space:nowrap}
td .sub{display:block;color:var(--mute);font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(5,10,26,.35)}
.stat b{display:block;font-family:var(--display);font-size:clamp(18px,2vw,24px);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--cyan);border-color:var(--cyan);color:#04122b;font-weight:600}
.empty{color:var(--dim);font-size:14px;padding:6px 0}

/* phone */
.phone{width:100%;max-width:370px;margin:0 auto;border:10px solid #0d1226;outline:1px solid var(--line2);border-radius:36px;background:#f4f6fb;color:#121a33;overflow:hidden;height:700px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.phone .bar{background:#0b165a;color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px}
.phone .bar b{font-family:var(--display);font-size:16px}
.phone .bar small{display:block;font-size:11.5px;color:#b9c4f0}
.phone .bar button{background:transparent;border:0;color:#fff;font-size:20px;cursor:pointer;padding:0 6px 0 0}
.phone .scr{flex:1;overflow-y:auto;padding:14px}
.phone .job{background:#fff;border:1px solid #e1e6f2;border-radius:14px;padding:12px 13px;margin-bottom:10px;cursor:pointer;display:grid;gap:4px;width:100%;text-align:left;font:inherit;color:inherit}
.phone .job:hover{border-color:#0aa9df}
.phone .job .t{font-weight:600;font-size:14.5px}
.phone .job .s{font-size:12.5px;color:#5a6684}
.phone .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;justify-self:start}
.tag.todo{background:#e8f6fc;color:#05779c}.tag.done{background:#e3f7ee;color:#0f7a4f}.tag.urgent{background:#fdecee;color:#b4232f}
.phone h4{margin:14px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5a6684}
.phone .chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #e1e6f2;border-radius:10px;padding:9px 10px;margin-bottom:6px;font-size:14px;cursor:pointer}
.phone .chk input{width:18px;height:18px;margin-top:1px;accent-color:#0aa9df;flex:none}
.phone .photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phone .ph{aspect-ratio:4/3;border-radius:10px;border:1.5px dashed #b8c3dc;display:grid;place-items:center;font-size:12.5px;color:#5a6684;background:#fff;overflow:hidden;position:relative;cursor:pointer;text-align:center;padding:4px}
.phone .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phone .ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.phone canvas{width:100%;height:120px;background:#fff;border:1px solid #e1e6f2;border-radius:10px;touch-action:none;display:block}
.phone .pbtn{width:100%;margin-top:12px;background:#0b165a;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;font-size:15px}
.phone .pbtn.alt{background:#fff;color:#0b165a;border:1px solid #c9d2e8}
.phone .pbtn[disabled]{opacity:.4;cursor:not-allowed}
.phone .mat{display:grid;grid-template-columns:1fr 64px auto;gap:6px;margin-bottom:6px}
.phone .mat select,.phone .mat input{background:#fff;border:1px solid #d5dcec;color:#121a33;padding:7px 8px;font-size:13.5px}
.phone .mat button{border:1px solid #d5dcec;background:#fff;border-radius:8px;cursor:pointer;padding:0 10px}
.phone ul.mats{list-style:none;margin:0;padding:0;font-size:13.5px}
.phone ul.mats li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #e1e6f2}
.phone .okbox{background:#e3f7ee;border:1px solid #a7e3c7;color:#0f5e3e;border-radius:12px;padding:12px;font-size:14px}

/* report & certificate documents */
.doc{background:#fff;color:#141b33;border-radius:12px;padding:26px;font-size:14px}
.doc h3{font-family:var(--display);font-size:22px;color:#0b165a}
.doc .dh{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #0aa9df;padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
.doc .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.doc .kpis div{background:#f2f6fc;border-radius:10px;padding:10px}
.doc .kpis b{display:block;font-size:22px;font-family:var(--display);color:#0b165a;font-variant-numeric:tabular-nums}
.doc .kpis span{font-size:12px;color:#5a6684}
.doc table th{color:#5a6684;border-color:#e1e6f2}.doc table td{border-color:#e1e6f2}
.doc .sig{font-family:"Brush Script MT","Segoe Script",cursive;font-size:26px;color:#0b165a}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#0f1b3d;border:1px solid var(--cyan);color:var(--fg);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* monitoring */
.alarm{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:rgba(5,10,26,.4)}
.alarm.live{border-color:#7a2235;background:#1d0b14;animation:pulse 1.6s infinite}
.alarm.sos{border-color:var(--bad);background:#3a0c16}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(248,113,113,.15)}}
@media (prefers-reduced-motion:reduce){.alarm.live{animation:none}}
.alarm .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--warn)}
.cp{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cp:last-child{border-bottom:0}
.cp i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.cp.done i{border-color:var(--ok);background:#0b2a22;color:var(--ok)}
.sosbtn{width:100%;background:#b4232f;border:0;color:#fff;font-weight:800;letter-spacing:.12em;padding:16px;border-radius:14px;cursor:pointer;font-size:16px}

/* fence chart */
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:220px;padding:10px 0 0;position:relative}
.bars .b{display:grid;gap:6px;justify-items:center;align-content:end;height:100%}
.bars .b i{width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--cyan),#0a6f9a);display:block}
.bars .b.low i{background:linear-gradient(180deg,var(--bad),#7a2235)}
.bars .b span{font-size:12px;color:var(--mute);text-align:center}
.bars .b b{font-family:var(--mono);font-size:12.5px}
.thr{position:absolute;left:0;right:0;border-top:1.5px dashed var(--warn)}
.thr span{position:absolute;right:0;top:-18px;font-size:11.5px;color:var(--warn);font-family:var(--mono)}

.pass{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:#fff;color:#141b33;border-radius:14px;padding:16px}
.pass .qr{width:132px;height:132px}
.pass .qr img,.pass .qr canvas{width:132px!important;height:132px!important}
.pass b{font-family:var(--display);font-size:18px;color:#0b165a}
.pass .code{font-family:var(--mono);font-size:20px;letter-spacing:.12em;color:#0b165a}

.wa{background:#0b141a;border-radius:14px;padding:16px;display:grid;gap:8px}
.wa .msg{background:#005c4b;color:#e9fdf6;border-radius:10px 10px 2px 10px;padding:10px 12px;justify-self:end;max-width:90%;white-space:pre-wrap;font-size:14px}
.wa .who{font-size:12px;color:#8aa;}

@media (max-width:960px){
  .offer,.cols,.cols2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .stats,.doc .kpis{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .grid3,.parts,.form{grid-template-columns:1fr}
  .hero{min-height:560px}
  .hero .wrap{padding-block:100px 40px}
  .rec{display:none}
  .offer{padding:22px}
  .contact{grid-template-columns:1fr;text-align:left}
  .bars{gap:5px}
  .pass{grid-template-columns:1fr;justify-items:start}
  section.block{padding-block:52px}
}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#home" aria-label="Ivula Secure Ops home">
    <svg viewBox="80 15 120 155" aria-hidden="true"><defs><linearGradient id="g" x1="84" y1="20" x2="200" y2="152" gradientUnits="userSpaceOnUse"><stop stop-color="#13C8E8"/><stop offset="1" stop-color="#0AA9DF"/></linearGradient></defs><circle cx="128" cy="34" r="16" fill="url(#g)"/><path d="M102 66H132V142L108 120V98L84 104L102 66Z" fill="url(#g)"/><path d="M170 66V94L132 132V112L170 66Z" fill="url(#g)"/><path d="M196 104L136 164L124 152L150 118L196 104Z" fill="url(#g)"/></svg>
    <span>Ivula Secure Ops<small>BY IVULA TECHNOLOGIES</small></span>
  </a>
  <nav class="links" id="nav">
    <a href="#home">Overview</a>
    <a href="#service" class="star">Service &amp; Maintenance</a>
    <a href="#cctv">IP CCTV</a>
    <a href="#access">Access control</a>
    <a href="#fire">Fire alarms</a>
    <a href="#fence">Electric fences</a>
    <a href="#monitoring">Monitoring</a>
    <a href="#business">Quotes &amp; website</a>
  </nav>
</div></header>

<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer><div class="wrap">
  <span>Ivula Technologies · Nairobi · ivulatechnologies.com</span>
  <span>Everything in these demos is sample data, for illustration.</span>
</div></footer>

<script>
(function(){
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kes=n=>'KES '+Math.round(n).toLocaleString('en-KE');
const pad=n=>String(n).padStart(2,'0');
const now=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};

 $('#sim').onclick=()=>{newAlarm();drawMon();toast('New alarm received.')};
 $('#scan').onclick=()=>{const p=MON.patrol.find(p=>!p[1]);if(p){p[1]=now();drawMon()}};
 $('#sos').onclick=()=>{MON.alarms.unshift({id:'AL-'+(400+ ++MON.seq),site:'Riverside Apartments',zone:'Guard John Ouma · GPS -1.2921, 36.7856',type:'SOS from guard',t0:Date.now(),state:'new',sos:true});drawMon();toast('SOS received in the control room.')};
 drawMon();
 const t=setInterval(()=>document.querySelectorAll('[data-tm]').forEach(e=>{const a=MON.alarms.find(a=>a.id===e.dataset.tm);if(a)e.textContent=dur((a.t1||Date.now())-a.t0)}),1000);cleanup.push(()=>clearInterval(t));
}
function newAlarm(i,ago){const p=ALARM_POOL[i!=null?i:(MON.seq%ALARM_POOL.length)];MON.alarms.unshift({id:'AL-'+(400+ ++MON.seq),site:p[0],zone:p[1],type:p[2],t0:Date.now()-(ago||0)*1000,state:'new'})}
const dur=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60)};
function drawMon(){
 const A=MON.alarms,open=A.filter(a=>a.state!=='closed'),closed=A.filter(a=>a.state==='closed');
 const avg=closed.length?dur(closed.reduce((s,a)=>s+(a.t1-a.t0),0)/closed.length):'—';
 $('#mstats').innerHTML=`<div class="stat"><b style="color:${open.length?'var(--bad)':'var(--ok)'}">${open.length}</b><span>Open alarms</span></div><div class="stat"><b>${closed.length+38}</b><span>Alarms this month</span></div><div class="stat"><b class="num">${avg}</b><span>Average response (this session)</span></div><div class="stat"><b>${MON.patrol.filter(p=>p[1]).length}/${MON.patrol.length}</b><span>Checkpoints scanned</span></div>`;
 const el=$('#alarms');
 el.innerHTML=A.length?A.map((a,i)=>{const live=a.state!=='closed';return `<div class="alarm ${a.sos&&live?'sos':live?'live':''}"><div class="top"><b>${a.type}</b>${live?`<span class="timer" data-tm="${a.id}">${dur(Date.now()-a.t0)}</span>`:`<span class="pill ok">Closed · ${a.outcome} · ${dur(a.t1-a.t0)}</span>`}</div>
  <div>${esc(a.site)} <span class="mute">· ${esc(a.zone)}</span></div>
  ${a.unit?`<div class="mute" style="font-size:13.5px">${a.unit} ${a.state==='arrived'||a.state==='closed'?'arrived':'on the way'}</div>`:''}
  ${live?`<div class="row">${a.state==='new'?`<select data-u="${i}" style="width:auto">${MON.units.map(u=>`<option>${u}</option>`).join('')}</select><button class="btn sm pri" data-d="${i}">Send team</button>`:a.state==='sent'?`<button class="btn sm" data-a="${i}">Team arrived</button>`:`<select data-oc="${i}" style="width:auto"><option>False alarm</option><option>Intruder, police called</option><option>Technical fault</option><option>Guard emergency resolved</option></select><button class="btn sm pri" data-c="${i}">Close alarm</button>`}</div>`:''}
 </div>`}).join(''):'<p class="empty">No alarms.</p>';
 el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const a=A[b.dataset.d];a.unit=el.querySelector(`[data-u="${b.dataset.d}"]`).value;a.state='sent';drawMon()});
 el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{A[b.dataset.a].state='arrived';drawMon()});
 el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const a=A[b.dataset.c];a.outcome=el.querySelector(`[data-oc="${b.dataset.c}"]`).value;a.state='closed';a.t1=Date.now();
  MON.incidents.unshift({id:'IR-'+(311+MON.seq),when:'Today '+now(),site:a.site,what:a.type+' at '+a.zone+'. '+(a.unit||'Team')+' attended.',outcome:a.outcome});toast('Alarm closed. Incident report added for '+a.site+'.');drawMon()});
 $('#pprog').textContent=MON.patrol.filter(p=>p[1]).length+' of '+MON.patrol.length;
 $('#cps').innerHTML=MON.patrol.map(p=>`<div class="cp ${p[1]?'done':''}"><i>${p[1]?'✓':''}</i><span style="flex:1">${p[0]}</span><span class="mono mute">${p[1]||'waiting'}</span></div>`).join('');
 $('#scan').disabled=!MON.patrol.some(p=>!p[1]);
 $('#inc').innerHTML=`<table><thead><tr><th>Report</th><th>When</th><th>Site</th><th>What happened</th><th>Outcome</th></tr></thead><tbody>${MON.incidents.map(r=>`<tr><td class="mono">${r.id}</td><td>${r.when}</td><td>${esc(r.site)}</td><td>${esc(r.what)}</td><td>${esc(r.outcome)}</td></tr>`).join('')}</tbody></table>`;
}

/* ---------------- BUSINESS ---------------- */
const CAT=[['4MP IP dome camera',6500],['4MP IP bullet camera',7200],['8-channel NVR with 2TB disk',28000],['PoE switch, 8 port',9500],['Fingerprint and face reader',24000],['Electric fence energiser',18500],['Fence wire and insulators (per metre)',450],['Smoke detector',2900],['Installation labour (per day)',8000]];
const QT={lines:[[0,4],[2,1],[3,1],[8,2]],client:'Riverside Apartments',state:'draft'};
function business(){
 app.innerHTML=head('Quotes, website and payments','Win the job before the competition replies.','Build a branded quote in a few minutes. The client opens one link, approves it, signs and pays the deposit by M-Pesa. Website visitors request a site survey and it lands on your WhatsApp.')+
 `<div class="wrap demo"><div class="cols2">
  <div class="panel"><div class="ph"><h3>Quote builder</h3><span class="mute" style="font-size:13px">Sample prices</span></div><div class="pb" id="qb"></div></div>
  <div class="panel"><div class="ph"><h3>What the client sees</h3></div><div class="pb" id="qc"></div></div>
 </div>
 <div class="cols2">
  <div class="panel"><div class="ph"><h3>Website: request a site survey</h3></div><div class="pb"><form id="wf" class="form"><label>Name<input id="wn" value="Esther Wambui"></label><label>Phone<input id="wp" value="0722 000 111"></label><label>Area<input id="wa" value="Runda"></label><label>Interested in<select id="ws"><option>IP CCTV</option><option>Electric fence</option><option>Access control</option><option>Fire alarm</option><option>Alarm monitoring</option></select></label><label class="full">Details<input id="wd" value="4-bedroom house, want cameras and a fence upgrade"></label><div class="full"><button class="btn pri" type="submit">Send request</button></div></form></div></div>
  <div class="panel"><div class="ph"><h3>Arrives on your WhatsApp</h3></div><div class="pb"><div class="wa" id="wa"><div class="who">Your business WhatsApp</div><p class="empty" style="color:#8aa">Send the form to see the message.</p></div></div></div>
 </div></div>`;
 $('#wf').onsubmit=e=>{e.preventDefault();$('#wa').innerHTML=`<div class="who">Your business WhatsApp · ${now()}</div><div class="msg">New site survey request from your website\n\nName: ${esc($('#wn').value)}\nPhone: ${esc($('#wp').value)}\nArea: ${esc($('#wa').value)}\nService: ${esc($('#ws').value)}\nDetails: ${esc($('#wd').value)}</div>`;toast('Request sent. The visitor sees a thank-you page.')};
 drawQ();
}
function qTotals(){const sub=QT.lines.reduce((s,[i,q])=>s+CAT[i][1]*q,0),vat=sub*.16;return{sub,vat,tot:sub+vat,dep:(sub+vat)/2}}
function drawQ(){const t=qTotals();
 $('#qb').innerHTML=`<label style="margin-bottom:12px">Client<input id="qcl" value="${esc(QT.client)}"></label>
 <div class="tbl"><table><thead><tr><th>Item</th><th>Qty</th><th class="num">Amount</th><th></th></tr></thead><tbody>${QT.lines.map(([i,q],k)=>`<tr><td>${CAT[i][0]}</td><td><input type="number" min="1" value="${q}" data-q="${k}" style="width:64px" aria-label="Quantity"></td><td class="num">${kes(CAT[i][1]*q)}</td><td><button class="btn sm" data-del="${k}" aria-label="Remove">✕</button></td></tr>`).join('')}</tbody></table></div>
 <div class="row" style="margin:12px 0"><select id="qadd" style="flex:1;min-width:180px">${CAT.map((c,i)=>`<option value="${i}">${c[0]} · ${kes(c[1])}</option>`).join('')}</select><button class="btn sm" id="qaddb">Add line</button></div>
 <div style="display:grid;gap:4px;font-size:14px" class="num"><div class="row" style="justify-content:space-between"><span class="mute">Subtotal</span><span>${kes(t.sub)}</span></div><div class="row" style="justify-content:space-between"><span class="mute">VAT 16%</span><span>${kes(t.vat)}</span></div><div class="row" style="justify-content:space-between;font-size:17px"><b>Total</b><b>${kes(t.tot)}</b></div></div>
 <button class="btn pri" id="qsend" style="margin-top:14px">Send quote link</button>`;
 $('#qcl').oninput=e=>{QT.client=e.target.value;drawC()};
 document.querySelectorAll('[data-q]').forEach(i=>i.onchange=()=>{QT.lines[i.dataset.q][1]=Math.max(1,+i.value||1);QT.state='draft';drawQ()});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{QT.lines.splice(b.dataset.del,1);QT.state='draft';drawQ()});
 $('#qaddb').onclick=()=>{QT.lines.push([+$('#qadd').value,1]);QT.state='draft';drawQ()};
 $('#qsend').onclick=()=>{QT.state='sent';toast('Quote link sent to '+QT.client+' by SMS and email.');drawC()};
 drawC();}
function drawC(){const t=qTotals(),el=$('#qc');
 if(QT.state==='draft'){el.innerHTML='<p class="empty">Press “Send quote link” to see the client’s page.</p>';return}
 el.innerHTML=`<div class="doc"><div class="dh"><div><h3>Quotation Q-1042</h3><div style="color:#5a6684">For ${esc(QT.client)} · ${today()}</div></div><div style="font-size:12.5px;color:#5a6684;text-align:right">Your company<br>name and logo</div></div>
 <table><tbody>${QT.lines.map(([i,q])=>`<tr><td>${CAT[i][0]} × ${q}</td><td class="num" style="text-align:right">${kes(CAT[i][1]*q)}</td></tr>`).join('')}<tr><td><b>Total incl. VAT</b></td><td class="num" style="text-align:right"><b>${kes(t.tot)}</b></td></tr></tbody></table>
 ${QT.state==='sent'?`<p style="margin:14px 0 8px;color:#5a6684">A 50% deposit of <b style="color:#0b165a">${kes(t.dep)}</b> confirms the job.</p><button class="pbtn" id="qok" style="width:100%;background:#0b165a;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer">Approve and pay deposit by M-Pesa</button>`:
  QT.state==='paying'?`<p style="margin:14px 0 0;color:#8a5a00"><b>Check your phone</b> and enter your M-Pesa PIN…</p>`:
  `<div style="margin-top:14px;background:#e3f7ee;border:1px solid #a7e3c7;color:#0f5e3e;border-radius:12px;padding:12px">Approved and signed by ${esc(QT.client)}. Deposit of ${kes(t.dep)} received. The installation has been booked.</div>`}</div>`;
 const b=$('#qok');if(b)b.onclick=()=>{QT.state='paying';drawC();setTimeout(()=>{QT.state='paid';toast('Deposit received. Job created for the installation team.');drawC()},2600)};
}

route();
})();
</script>

</body>
</html>
